spring:
  application:
    name: eessi-pensjon-documentation-api
  main:
    banner-mode: "off"
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AZURE_OPENID_CONFIG_ISSUER:http://localhost/not-configured}
          jwk-set-uri: ${AZURE_OPENID_CONFIG_JWKS_URI:http://localhost/not-configured}
          audiences: ${AZURE_APP_CLIENT_ID:eessi-pensjon-documentation-api}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
