kind: Application
apiVersion: nais.io/v1alpha1
metadata:
  name: {{ name }}
  namespace: eessipensjon
  labels:
    team: eessipensjon
spec:
  image: {{ image }}
  port: 8080
  ingresses:
    - {{ ingress }}
  liveness:
    path: /actuator/health/liveness
    port: 8080
    initialDelay: 30
    timeout: 5
    periodSeconds: 10
    failureThreshold: 6
  readiness:
    path: /actuator/health/readiness
    port: 8080
    initialDelay: 15
    timeout: 5
    periodSeconds: 10
    failureThreshold: 6
  prometheus:
    enabled: true
    path: /actuator/prometheus
  replicas:
    min: {{ replicas.min }}
    max: {{ replicas.max }}
  resources:
    limits:
      memory: {{ resources.limits.memory }}
    requests:
      cpu: {{ resources.requests.cpu }}
      memory: {{ resources.requests.memory }}
  azure:
    application:
      enabled: true
      allowAllUsers: true
      claims:
        extra:
          - "NAVident"
  accessPolicy:
    inbound:
      rules:
        - application: eessi-pensjon-documentation
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
    logging:
      destinations:
        - id: elastic
        - id: loki
  env:
    - name: LOGGING_STRUCTURED_FORMAT_CONSOLE
      value: logstash
