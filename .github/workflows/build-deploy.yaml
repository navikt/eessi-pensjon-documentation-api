name: Build and deploy

run-name: Build - ${{ github.event.head_commit.message || github.event.pull_request.title || 'manual' }}

permissions:
  contents: read
  id-token: write

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build, test and image
    runs-on: ubuntu-latest

    outputs:
      docker-image: ${{ steps.docker-build-push.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and test
        run: mvn clean verify --no-transfer-progress -B

      - name: Push docker image to GAR
        if: github.event_name != 'pull_request'
        uses: nais/docker-build-push@v0
        id: docker-build-push
        with:
          team: eessipensjon
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}

  deploy-dev:
    name: Deploy to NAIS - dev-gcp
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy to dev-gcp
        uses: nais/deploy/actions/deploy@v2
        env:
          CLUSTER: dev-gcp
          RESOURCE: .nais/nais.yaml
          VAR: image=${{ needs.build.outputs.docker-image }}
          VARS: .nais/dev.yaml
